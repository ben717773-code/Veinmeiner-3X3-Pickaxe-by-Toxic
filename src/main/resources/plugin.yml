name: HammerVein
version: '${version}'
main: de.example.hammervein.HammerVeinPlugin
api-version: '1.21.11'
description: Veinminer und eine 3x3 Spitzhacke
commands:
  hammer:
    description: Gibt dir die 3x3 Spitzhacke
    permission: hammervein.give
  veinminer:
    description: Veinminer ein- oder ausschalten
    permission: hammervein.veinminer
permissions:
  hammervein.give:
    default: op
  hammervein.veinminer:
    default: true
